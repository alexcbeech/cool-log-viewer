appId: com.cool-log-viewer.app
productName: Cool Log Viewer
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
nsis:
  oneClick: false
  createDesktopShortcut: true
  perMachine: false
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: x64
